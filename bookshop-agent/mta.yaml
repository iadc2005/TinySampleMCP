_schema-version: 3.3.0
ID: bookshop-agent
version: 1.0.0
description: "A simple CAP project."
parameters:
  enable-parallel-deployments: true
  deploy_mode: html5-repo
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production
modules:
  - name: bookshop-agent-srv
    type: nodejs
    path: gen/srv
    parameters:
      instances: 1
      buildpack: nodejs_buildpack
      routes:
        - route: "${default-url}"
        - route: "${default-host}.cert.${default-domain}"
    build-parameters:
      builder: npm-ci
    provides:
      - name: srv-api # required by consumers of CAP services (e.g. approuter)
        properties:
          srv-url: ${default-url}
          srv-cert-url: '${protocol}://${default-host}.cert.${default-domain}'
    requires:
      - name: bookshop-agent-ias
        parameters:
          config:
            credential-type: X509_GENERATED
            app-identifier: srv
      - name: bookshop-agent-db
      - name: bookshop-agent-aicore
    deployed-after:
      - bookshop-agent-ams-policies-deployer
    properties:
      AMS_DCL_ROOT: ams/dcl

  - name: bookshop-agent-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
    requires:
      - name: bookshop-agent-db

  - name: bookshop-agent-app-deployer
    type: com.sap.application.content
    path: gen
    build-parameters:
      build-result: app/
      requires:
        - name: bookshopagentbooks
          artifacts:
            - books.zip
          target-path: app/
    requires:
      - name: srv-api
      - name: bookshop-agent-app-front
        parameters:
          content-target: true
          config:
            IASDependencyName: bookshop-agent-ias-api
    parameters:
      config:
        destinations:
          - name: srv-api
            url: ~{srv-api/srv-url}
            forwardAuthToken: true
            IASDependencyName: bookshop-agent-ias-api

  - name: bookshopagentbooks
    type: html5
    path: app/books
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm ci
        - npm run build
      supported-platforms:
        []

  - name: bookshop-agent-ams-policies-deployer
    type: javascript.nodejs
    path: gen/policies
    parameters:
      buildpack: nodejs_buildpack
      no-route: true
      no-start: true
      tasks:
        - name: deploy-dcl
          command: npm start
          memory: 512M
    requires:
      - name: bookshop-agent-ias
        parameters:
          config:
            credential-type: X509_GENERATED
            app-identifier: ams-policy-deployer

  - name: bookshop-agent
    type: approuter.nodejs
    path: app/router
    requires:
      - name: bookshop-agent-ias
        parameters:
          config:
            credential-type: X509_GENERATED
            app-identifier: approuter
      - name: srv-api
        group: destinations
        properties:
          url: ~{srv-cert-url}
          forwardAuthCertificates: true
          forwardAuthToken: true
          strictSSL: true
    parameters:
      keep-existing-routes: true
      disk-quota: 256M
      memory: 256M
    provides:
      - name: app-api
        properties:
          app-protocol: ${protocol}
          app-uri: ${default-uri}

resources:
  - name: bookshop-agent-ias
    type: org.cloudfoundry.managed-service
    parameters:
      service: identity
      service-name: bookshop-agent-ias
      service-plan: application
      config:
        provided-apis:
          - name: bookshop-agent-ias-api
            description: API exposed by the application
        consumed-apis:
          - name: bookshop-agent-ias-api
            resource: urn:sap:identity:application:provider:name:bookshop-agent-ias-api
        display-name: bookshop-agent
        oauth2-configuration:
          token-policy:
            access-token-format: "jwt"
          redirect-uris:
            - http://localhost:5000/login/callback?authType=ias
            - ~{app-api/app-protocol}://*~{app-api/app-uri}/login/callback
            # SAP Joule Work Desktop PKCE callback (MCP connector)
            - http://localhost:18766/mcp-callback
          post-logout-redirect-uris:
            - ~{app-api/app-protocol}://*~{app-api/app-uri}/*/logout.html
        xsuaa-cross-consumption: true
        authorization:
          enabled: true
    requires:
      - name: app-api
  - name: bookshop-agent-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
  - name: bookshop-agent-app-front
    type: org.cloudfoundry.managed-service
    parameters:
      service: app-front
      service-plan: developer
  - name: bookshop-agent-aicore
    type: org.cloudfoundry.existing-service
    parameters:
      service-name: default_aicore
